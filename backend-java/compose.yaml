services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-queue-postgres
    environment:
      POSTGRES_DB: smartqueue
      POSTGRES_USER: smartqueue
      POSTGRES_PASSWORD: smartqueue
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartqueue -d smartqueue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
